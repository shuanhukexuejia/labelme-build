name: Build Labelme Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "labelme==6.3.1" "onnxruntime<1.24" pyinstaller

      - name: Create launcher
        shell: pwsh
        run: |
          Set-Content -Path launcher.py -Encoding UTF8 -Value @'
          from labelme.__main__ import main

          if __name__ == "__main__":
              main()
          '@

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Labelme --collect-all labelme --collect-all osam --collect-all imgviz launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Labelme-Windows
          path: dist/Labelme.exe
          if-no-files-found: error
