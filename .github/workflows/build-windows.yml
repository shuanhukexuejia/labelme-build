name: Build Labelme Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install dependencies and check imports
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install "labelme==6.3.1" "onnxruntime==1.23.2" "numpy==1.26.4" pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency check failed" }
          python -c "import labelme, onnxruntime; assert labelme.__version__ == '6.3.1'; print('ONNX Runtime:', onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Import check failed" }

      - name: Create launcher
        run: |
          Set-Content -Path launcher.py -Encoding UTF8 -Value @'
          from multiprocessing import freeze_support

          if __name__ == "__main__":
              freeze_support()
              import sys

              if len(sys.argv) == 3 and sys.argv[1] == "--smoke-test":
                  import faulthandler
                  import traceback
                  from pathlib import Path

                  marker = Path(sys.argv[2])
                  with marker.with_suffix(".log").open("w", encoding="utf-8", buffering=1) as log:
                      faulthandler.enable(file=log)
                      try:
                          print("Importing Labelme and ONNX Runtime...", file=log)
                          from labelme.__main__ import main
                          print("Initializing Qt...", file=log)
                          from PyQt5.QtWidgets import QApplication
                          app = QApplication([])
                          app.processEvents()
                          app.quit()
                          del app
                          print("Qt initialized and closed successfully.", file=log)
                          marker.write_text("ok", encoding="utf-8")
                      except BaseException:
                          traceback.print_exc(file=log)
                          sys.exit(1)
                      finally:
                          faulthandler.disable()
              else:
                  from labelme.__main__ import main
                  main()
          '@

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Labelme --collect-all labelme --collect-all osam --collect-all imgviz --recursive-copy-metadata labelme launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Download and install Microsoft runtime
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature -FilePath vc_redist.x64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') {
            throw "Microsoft runtime signature verification failed"
          }
          $runtime = Start-Process -FilePath "$PWD\vc_redist.x64.exe" -ArgumentList '/install /quiet /norestart' -Wait -PassThru
          if ($runtime.ExitCode -notin @(0, 1638, 3010, -2147023258)) {
            throw "Microsoft runtime installation failed: $($runtime.ExitCode)"
          }

      - name: Remove conflicting bundled Microsoft runtime DLLs
        run: |
          Get-Item "$env:SystemRoot\System32\msvcp140.dll" | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | Format-List
          Get-ChildItem -Path dist\Labelme -Filter msvcp140.dll -Recurse | Select-Object FullName, @{Name='Version';Expression={$_.VersionInfo.FileVersion}} | Format-List
          Set-Content -Path clean_runtime.py -Encoding UTF8 -Value @'
          from pathlib import Path

          root = Path("dist/Labelme")
          if not root.is_dir():
              raise FileNotFoundError(root)

          # Qt wheels can ship older VC++ DLLs that override the installed runtime.
          runtime_names = {
              "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll",
              "msvcp140_atomic_wait.dll", "msvcp140_codecvt_ids.dll",
              "vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll",
              "concrt140.dll", "vccorlib140.dll",
          }
          for path in root.rglob("*"):
              if path.is_file() and path.name.lower() in runtime_names:
                  print("Using the installed Microsoft runtime instead of:", path)
                  path.unlink()
          assert not any(p.is_file() and p.name.lower() in runtime_names for p in root.rglob("*"))
          '@
          python clean_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime DLL cleanup failed" }

      - name: Check packaged DLL imports and Qt startup
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "labelme-smoke-test.txt"
          $log = [System.IO.Path]::ChangeExtension($marker, '.log')
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "$PWD\dist\Labelme\Labelme.exe" -ArgumentList @('--smoke-test', ('"' + $marker + '"')) -PassThru
          $timedOut = -not $app.WaitForExit(120000)
          if ($timedOut) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
            Copy-Item -LiteralPath $log -Destination "$PWD\startup-check.log"
          } else {
            'The application did not reach the Python launcher.' | Set-Content "$PWD\startup-check.log"
          }
          if ($timedOut) { throw "Packaged application startup timed out; see the startup log above" }
          $app.Refresh()
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $marker)) {
            throw "Packaged application failed startup; see the startup log above"
          }
          if ((Get-Content -LiteralPath $marker -Raw) -ne 'ok') {
            throw "Unexpected startup check result"
          }

      - name: Upload startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Labelme-Startup-Diagnostics
          path: startup-check.log
          if-no-files-found: warn

      - name: Create installer
        run: |
          Set-Content -Path installer.iss -Encoding UTF8 -Value @'
          [Setup]
          AppId=Labelme.Community.6
          AppName=Labelme
          AppVersion=6.3.1
          DefaultDirName={autopf}\Labelme
          DefaultGroupName=Labelme
          DisableProgramGroupPage=yes
          OutputDir=installer-output
          OutputBaseFilename=Labelme-6.3.1-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0
          UninstallDisplayIcon={app}\Labelme.exe

          [Files]
          Source: "dist\Labelme\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "vc_redist.x64.exe"; Flags: dontcopy

          [Icons]
          Name: "{group}\Labelme"; Filename: "{app}\Labelme.exe"
          Name: "{autodesktop}\Labelme"; Filename: "{app}\Labelme.exe"

          [Code]
          var
            RuntimeNeedsRestart: Boolean;

          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var
            ExitCode: Integer;
          begin
            Result := '';
            ExtractTemporaryFile('vc_redist.x64.exe');
            if not Exec(ExpandConstant('{tmp}\vc_redist.x64.exe'),
              '/install /quiet /norestart', '', SW_HIDE, ewWaitUntilTerminated, ExitCode) then
            begin
              Result := 'Microsoft runtime could not start. Setup cannot continue.';
              Exit;
            end;
            if ExitCode = 3010 then
              RuntimeNeedsRestart := True
            else if (ExitCode <> 0) and (ExitCode <> 1638) and (ExitCode <> -2147023258) then
              Result := 'Microsoft runtime installation failed (code ' + IntToStr(ExitCode) + '). Setup cannot continue.';
          end;

          function NeedRestart(): Boolean;
          begin
            Result := RuntimeNeedsRestart;
          end;
          '@
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler is not installed on this runner" }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Labelme-Windows-Installer
          path: installer-output/Labelme-6.3.1-Windows-Setup.exe
          if-no-files-found: error
