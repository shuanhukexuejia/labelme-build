name: Build Labelme Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Labelme and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install labelme==6.3.1 pyinstaller

      - name: Create launcher
        shell: pwsh
        run: |
          Set-Content launcher.py @'
          from labelme.__main__ import main

          if __name__ == "__main__":
              main()
          '@

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Labelme `
            --collect-all labelme `
            --collect-all PyQt5 `
            --collect-all osam `
            --collect-all imgviz `
            launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Labelme-Windows
          path: dist/Labelme.exe
